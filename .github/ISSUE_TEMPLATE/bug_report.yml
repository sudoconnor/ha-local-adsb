name: Bug report
description: Report a problem with the Local ADS-B Receiver integration
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: input
    id: receiver
    attributes:
      label: Receiver software
      placeholder: Pi24, dump1090-fa, readsb, tar1090, etc.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
